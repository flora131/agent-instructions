name: Probe installed patchelf
on:
  push:
    branches: [fix/release-llvm-preinstalled]
    paths: [.github/workflows/probe-patchelf.yml]
permissions:
  contents: read
jobs:
  patchelf:
    name: Probe patchelf ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 2
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x64, runner: blacksmith-4vcpu-ubuntu-2404 }
          - { arch: arm64, runner: blacksmith-4vcpu-ubuntu-2404-arm }
    steps:
      - name: Verify installed patchelf and edit a host ELF
        shell: bash
        run: |
          set -euo pipefail
          command -v patchelf
          patchelf --version
          probe="$RUNNER_TEMP/atomic-patchelf-probe"
          cp /bin/true "$probe"
          patchelf --set-rpath '$ORIGIN' "$probe"
          test "$(patchelf --print-rpath "$probe")" = '$ORIGIN'
          "$probe"
